name: Daily Federal Opportunity Discovery

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerc-federal-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build human review queue from Grants.gov
        run: |
          if ! python scripts/discover_federal_opportunities.py; then
            sleep 20
            python scripts/discover_federal_opportunities.py
          fi
      - name: Add summary
        run: cat federal-opportunity-review-queue.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review queue
        uses: actions/upload-artifact@v6
        with:
          name: federal-opportunity-review-queue
          path: |
            federal-opportunity-review-queue.csv
            federal-opportunity-review-queue.md
