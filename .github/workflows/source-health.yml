name: Daily RERC Maintenance Watcher

on:
  schedule:
    # Native timezone scheduling preserves 03:33 Eastern across DST changes.
    # Do not gate on runner start time: scheduled jobs can start late.
    - cron: '33 3 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rerc-source-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read and verify public intake sheets
        id: intake
        continue-on-error: true
        env:
          RERC_NEW_ITEMS_SHEET_URL: ${{ vars.RERC_NEW_ITEMS_SHEET_URL }}
          RERC_ISSUES_SHEET_URL: ${{ vars.RERC_ISSUES_SHEET_URL }}
        run: python scripts/rerc_intake_watcher.py --scheduled --force
      - name: Restore prior source signals
        uses: actions/cache/restore@v5
        with:
          path: .source-monitor/state.json
          key: rerc-source-monitor-${{ github.run_id }}
          restore-keys: |
            rerc-source-monitor-
      - name: Check funding and resource links
        id: catalog
        continue-on-error: true
        run: |
          if ! python scripts/grantlink_3po.py; then
            sleep 20
            python scripts/grantlink_3po.py
          fi
      - name: Audit funding deadline coverage
        id: deadlines
        if: always()
        continue-on-error: true
        run: python scripts/qa_funding_deadlines.py --write-report
      - name: Check community example links
        id: examples
        if: always()
        continue-on-error: true
        run: |
          if ! python scripts/check_case_sources.py; then
            sleep 20
            python scripts/check_case_sources.py
          fi
      - name: Add review summary
        if: always()
        run: |
          if [ -f intake-review/intake-review-queue.md ]; then
            cat intake-review/intake-review-queue.md >> "$GITHUB_STEP_SUMMARY"
            printf "\n" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Intake review queue was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f source-health-report.md ]; then
            cat source-health-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source health report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f funding-deadline-audit.md ]; then
            printf "\n" >> "$GITHUB_STEP_SUMMARY"
            cat funding-deadline-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Funding deadline audit was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload maintenance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rerc-maintenance-report
          path: |
            intake-review/intake-review-queue.json
            intake-review/intake-review-queue.md
            source-health-report.json
            source-health-report.md
            case_studies.source_health.json
            funding-deadline-audit.json
            funding-deadline-audit.md
            .source-monitor/state.json
      - name: Publish sanitized intake queue to maintainer issue
        continue-on-error: true
        if: always() && hashFiles('intake-review/intake-review-queue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="RERC intake watcher review queue"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "RERC intake watcher review queue") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file intake-review/intake-review-queue.md
          else
            gh issue create --title "$title" --body-file intake-review/intake-review-queue.md
          fi
      - name: Save current source signals
        if: always() && hashFiles('.source-monitor/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .source-monitor/state.json
          key: rerc-source-monitor-${{ github.run_id }}
      - name: Enforce hard-failure gate
        if: always()
        run: |
          test "${{ steps.intake.outcome }}" = "success"
          test "${{ steps.catalog.outcome }}" = "success"
          test "${{ steps.deadlines.outcome }}" = "success"
          test "${{ steps.examples.outcome }}" = "success"
