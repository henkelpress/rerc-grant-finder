name: RERC Explorer QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerc-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Check application and QA syntax
        run: |
          node --check app.js
          node --check planner.js
          node --check ui-i18n.js
          node --check site-config.js
          node --check deadline-utils.js
          node --check scripts/qa_deadline_parity.cjs
          node --check scripts/qa_public_site.cjs
      - name: Run release checks
        run: |
          python scripts/catalog_maintenance.py check
          python scripts/qa_geography_coverage.py
          python scripts/qa_release.py
      - name: Install browser QA dependencies
        run: |
          retry() {
            for attempt in 1 2; do
              "$@" && return 0
              test "$attempt" = 2 && return 1
              sleep 15
            done
          }
          retry npm ci
          retry npx playwright install --with-deps chromium
      - name: Run browser and mobile QA
        run: |
          python -m http.server 8877 --bind 127.0.0.1 > /tmp/rerc-http.log 2>&1 &
          if ! node scripts/qa_public_site.cjs http://127.0.0.1:8877/ browser-qa; then
            sleep 5
            node scripts/qa_public_site.cjs http://127.0.0.1:8877/ browser-qa
          fi
          python scripts/generate_source_qa_evidence.py --browser-report browser-qa/playwright_qa.json
          git diff --exit-code -- rercie/packaging/QA_EVIDENCE.json
          python scripts/qa_release.py
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa
          path: browser-qa/
          if-no-files-found: error
